name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean old builds
        run: rm -f dist/*.cs3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify and Package Aether Plugins
        run: |
          node scripts/verify-repo.js
          node pack_plugin.js

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace 2>&1
          mkdir -p builds
          cp **/build/*.cs3 builds/ || true
          cp build/plugins.json builds/ || true

      - name: Push builds
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Build ${{ github.sha }}"
          file_pattern: "builds/*"
          branch: "builds"
          repository: "./"
